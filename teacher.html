<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>لوحة المعلمة المشرفة — مقياس الميول المهنية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#131b34;--mut:#64748b;--acc:#8b1226;--soft:#fdf2f4;--gold:#d97706;--line:#e2e8f0;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.9}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ic{width:44px;height:44px;border-radius:14px;border:1px solid #f0c9d0;background:var(--soft);font-size:1.3rem;cursor:pointer}
.ttl{flex:1;min-width:170px}.ttl b{display:block;font-size:1.05rem}.ttl span{font-size:.82rem;color:var(--mut)}
.step{background:#eef2f7;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;justify-content:space-between;font-weight:600;font-size:.85rem;color:var(--acc)}
.step i{font-style:normal;color:var(--mut)}
main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:2.3rem;font-weight:700;margin:.3em 0;text-align:center}h2{font-size:1.6rem;margin:.2em 0 .6em}h3{font-size:1.05rem;margin:.8em 0 .2em;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin:14px 0}
.pill{display:block;width:fit-content;margin:8px auto;background:var(--soft);border:1px solid #f0c9d0;color:var(--acc);border-radius:30px;padding:6px 20px;font-weight:600}
button,select,input{font:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:16px;padding:12px 24px;cursor:pointer;font-weight:700;box-shadow:0 6px 16px #8b12262e}
.btn.alt{background:#eef2f7;color:var(--ink);box-shadow:none}.btn.sm{padding:8px 14px;border-radius:12px;background:var(--soft);color:var(--acc);border:1px solid #f0c9d0}
.btn.block{width:100%;padding:16px;font-size:1.1rem}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
label{display:block;margin-top:14px;font-weight:700}
input,select{width:100%;padding:13px;border:2px solid var(--line);border-radius:16px;background:#f8fafc;color:var(--ink)}
.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.codes div{border:1px solid var(--line);border-radius:18px;padding:12px 16px;background:#f8fafc}.codes b{color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{font-size:1.35rem;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans .btn{padding:16px}
.big{font-size:3rem;font-weight:700;letter-spacing:.3em;text-align:center;color:var(--acc)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{border:1px solid var(--line);padding:8px;text-align:center}th{background:#eef2f7}
.tags span{display:inline-block;background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:2px 14px;margin:3px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat div{background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center}.stat b{display:block;font-size:2rem;color:var(--acc)}
.priv{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:16px;padding:12px 16px;margin:12px 0}
.note{color:var(--mut);font-size:.85rem}
.top{align-items:center;justify-content:space-between;margin:0}.top .btn{padding:10px 16px;border-radius:14px}.hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.soft{background:#f8fafc}.mini{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0;font-weight:700}.mini b{color:var(--acc)}
.hc{background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:16px 20px;margin:12px 0;position:relative}.hc .badge{position:absolute;left:16px;top:16px}
.badge{background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px 12px;color:var(--acc);font-weight:700}
.ex{color:var(--mut);font-size:.9rem}.ex b{color:#334155}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yn div{border:2px solid;border-radius:18px;padding:14px;font-weight:700}.yes{border-color:#a7f3d0;background:#fff}.no{border-color:#fbcfe8;background:#fff}
.warn{background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:12px 16px;margin-top:12px;color:#92400e}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:16px;padding:12px;background:#f8fafc;font-weight:400;margin:0}.opt input{width:auto}
.ft{text-align:center;color:var(--mut);font-size:.85rem;border-top:1px solid var(--line);padding:16px;background:#fff}.ft b{color:var(--acc)}
.jb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin:8px 0;background:#f8fafc}.jb span{flex:1;font-weight:700}.jb em{font-style:normal;background:var(--soft);color:var(--acc);border-radius:10px;padding:0 10px;font-size:.8rem}
main.wide{max-width:1100px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}.fl input,.fl select{padding:10px;border-radius:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.kp div{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center;font-size:.85rem;color:var(--mut)}.kp b{display:block;font-size:1.8rem;color:var(--acc)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:14px 0}.pg .card{margin:0}
.br{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.85rem}.br span{width:92px;flex:none}.bt{flex:1;height:10px;background:var(--line);border-radius:8px;overflow:hidden}.bt i{display:block;height:100%;background:var(--acc)}.br b{width:34px;text-align:left;color:var(--acc)}
.pt{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:16px}.pt table{font-size:.85rem;min-width:820px}.pt th{position:sticky;top:0;z-index:1}.pt tr.rw{cursor:pointer}.pt tr.rw:hover td{background:var(--soft)}.pt td{white-space:nowrap}
.tg{display:inline-block;border-radius:10px;padding:0 10px;font-size:.78rem}.tg.ok{background:#d1fae5;color:#047857}.tg.pr{background:#fef3c7;color:#92400e}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:50}.mc{background:var(--card);border-radius:24px;max-width:640px;width:100%;padding:20px}
@media print{body.pm main,body.pm header,body.pm .step,body.pm .ft{display:none!important}body.pm #modal{position:static;background:#fff;padding:0;display:block}body.pm .mc{box-shadow:none;max-width:100%}}
@media print{header,.step,.row,.noprint{display:none!important}body{background:#fff}.card{border-color:#999}}
</style>
</head>

{k:"C",n:"التقليدية",e:"Conventional",d:"تركز على الأرقام، البيانات، المستندات، الملفات، التنظيم الدقيق، والخطط والإجراءات الواضحة.",j:["كاتب","محلل مالي","مراقب حسابات","محاسب","منسق"]}];
// عبارات المقياس الـ54 بترتيب الدليل؛ كل ثلاث عبارات متتالية لبيئة (و،س،ف،ا،م،ت) بالتتابع
const QT=["أحب تركيب الأجهزة وإصلاحها.", "أستمتع بعمل مصنوعات خشبية مثل الأثاث المنزلي.", "أحب القيام بتصليحات كهربائية بسيطة.", "أستمتع بقراءة الكتب أو المجلات العلمية.", "أحب حل المسائل الرياضية الصعبة.", "أحب التفكير العميق للتوصل إلى حل للمشكلات.", "أحب الاستماع للأصوات الجميلة.", "أستمتع بكتابة الأعمال الأدبية مثل القصص أو المقالات أو الشعر... إلخ.", "أستمتع بأعمال النحت.", "أحب مساعدة زملائي في حل مشكلاتهم.", "أبادر بالحديث عند الالتقاء بزملاء جدد.", "أحب العمل الذي له علاقة مباشرة بالجمهور.", "أستمتع بتوجيه الآخرين فيما يقومون به من نشاط.", "أفضل المهام التي تتيح لي التخطيط والتنظيم لعمل الآخرين.", "أحب قراءة المجلات والمقالات المتخصصة في التجارة.", "أفضل الاستمرار في نفس العمل لساعات طويلة.", "أحب العمل الذي يتطلب التعامل مع الأرقام لإجراء عمليات حسابية بسيطة.", "أفضل إنجاز المشاريع بدقة خطوة تلو الأخرى.", "أفضل العمل في الهواء الطلق عن العمل داخل المكاتب.", "أستمتع بالعمل في المجالات التي تتطلب مني بذل جهد بدني.", "أحب ألعاب تركيب مجسمات الصور والأشكال.", "أحب إجراء التجارب بالمختبر.", "أحب العمل في المشاريع العلمية.", "أستمتع بحل المعادلات العلمية (رياضية أو كيميائية أو.......).", "أحب تلوين الأشياء.", "أستمتع برسم الأشخاص أو المناظر الطبيعية.", "أستمتع بالتصوير الضوئي.", "أحب المشاركة في الأنشطة المدرسية الجماعية.", "أحب المشاركة في الأعمال التطوعية.", "أحب التعامل مع الناس أكثر من التعامل مع الأدوات.", "أستمتع بترؤس فرق العمل.", "أميل إلى العمل الذي يمنحني مسؤولية اتخاذ القرار.", "أمتلك القدرة على إقناع الآخرين بآرائي.", "أفضل معرفة العمل المتوقع مني إنجازه قبل البدء فيه.", "أفضل وجود أنظمة ولوائح وإرشادات محددة وواضحة للعمل بها.", "أحب الاهتمام بالتفاصيل الدقيقة.", "أحب بيئة العمل التي تتيح لي حل المشكلات الميكانيكية مثل إصلاح المركبات وصيانة أجهزة التبريد.", "أحب القيام بأعمال تمديدات المياه (السباكة).", "أستمتع بعمل الصناعات اليدوية مثل الخناجر وغيرها.", "أستمتع بدراسة الآثار واكتشافها.", "أستمتع بإجراء البحوث العلمية.", "أستمتع بمتابعة الأخبار والبرامج العلمية.", "أحب التمثيل المسرحي.", "أحب القيام بأداء عمل فني أمام الآخرين.", "أستمتع بتصميم الأزياء أو الديكور.", "أحب العمل الذي له علاقة بتحسين الأوضاع الاجتماعية للآخرين.", "أحب العمل ضمن فريق.", "أفضل الأعمال التي تتطلب تعليم الآخرين وتدريبهم.", "أحب العمل بطريقتي الخاصة في تنظيم الأنشطة.", "أحب إلقاء خطاب أمام الآخرين.", "أفضل العمل بمشروع تجاري خاص.", "أتقبل الإرشادات من الآخرين من غير مناقشة.", "أفضل التأكد من إنهاء المهمة المسندة إلي.", "أحب تنظيم مكان العمل قبل البدء في العمل نفسه."];
const Q=QT.map((t,i)=>({k:"RIASEC"[Math.floor(i/3)%6],t}));
const govs=["جنوب الشرقية","شمال الشرقية","مسقط","جنوب الباطنة","شمال الباطنة","الداخلية","الظاهرة","البريمي","ظفار","مسندم","الوسطى"];

const $=s=>document.querySelector(s),app=$("#app");
const AR={R:"و",I:"س",A:"ف",S:"ا",E:"م",C:"ت"},GR=["التاسع","العاشر","الحادي عشر","الثاني عشر"];
function jobsHTML(code){const L=code.split(" ").map(k=>AR[k]),own=L.join(""),key=s=>[...s].sort().join("");
 const ex=JOBS[own]||[],par=Object.keys(JOBS).filter(c=>c!==own&&key(c)===key(own)).flatMap(c=>JOBS[c].map(j=>({j,c})));
 const item=(j,c,t)=>`<div class="jb"><span>${j}</span><em>${t}</em><small class="note">${c.split("").join("-")}</small></div>`;
 let o=`<h3>المهن المتطابقة مع رمزك المهني (الملحق الرابع)</h3><p class="note">المهن الواردة في الملحق الرابع المتوافقة مع رمزك المهني ${L.join(" - ")} وبيئتك الأولى (${T.find(t=>AR[t.k]===L[0]).n})</p>`;
 o+=ex.length?`<p><b>${ex.length} مهنة بتطابق تام</b></p>`+ex.map(j=>item(j,own,"تطابق تام")).join(""):`<p class="note">لا توجد مهن مدرجة بتطابق تام لهذا الرمز في الملحق.</p>`;
 if(par.length)o+=`<p><b>${par.length} مهنة بتطابق جزئي (نفس البيئات بترتيب مختلف)</b></p>`+par.map(x=>item(x.j,x.c,"تطابق جزئي")).join("");
 return o}
$("#sub").textContent=SCHOOL+" | "+SPECIALIST;$("#ftx").textContent="صفحة خاصة بالمعلمة المشرفة • "+SCHOOL+" • "+SPECIALIST;
// ===== لوحة المعلمة المشرفة (محمية بالرقم السري عبر Apps Script) =====
let PD=null,PL=[],PIN="";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GK={"التاسع":9,"العاشر":10,"الحادي عشر":11,"الثاني عشر":12};
const cAr=c=>c?c.split(" ").map(k=>AR[k]||k).join(" - "):"—";
function pmsg(t,err){const e=$("#perr");if(!e)return;e.style.visibility="visible";e.style.color=err?"#c0392b":"#6b7280";e.textContent=t}
function pfetch(pin){return fetch(SHEET_URL+"?action=admin&pin="+encodeURIComponent(pin)).then(r=>r.json())}
function setPD(d){PD=d.rows.map((x,i)=>({...x,_i:i,raw:x.raw||[]}))}
function drawPanel(){app.className="wide";
 const top=`<div class="row top"><span class="pill">🔒 لوحة المعلمة</span></div><hr class="hr">`;
 if(!SHEET_URL){app.innerHTML=`<div class="card">${top}<p>لم يُربط جدول البيانات بعد. ضعي رابط Apps Script في <b>SHEET_URL</b> داخل الملف.</p></div>`;return}
 if(PD){renderPanel();return}
 app.innerHTML=`<div class="card" style="max-width:420px;margin:24px auto">${top}<h2>دخول المعلمة المشرفة</h2><p class="note">أدخلي الرقم السري لعرض أداء الطالبات وبياناتهن.</p><label>الرقم السري<input id="pin" type="password" autocomplete="off"></label><p id="perr" class="note" style="visibility:hidden">.</p><div class="row"><button class="btn block" onclick="panelLogin()">دخول</button></div></div>`;
 $("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")panelLogin()});
 let p="";try{p=sessionStorage.getItem("pin")||""}catch(e){}
 if(p){$("#pin").value=p;panelLogin()}}
function panelLogin(){const pin=$("#pin").value.trim();if(!pin)return;pmsg("جارٍ التحميل...");
 pfetch(pin).then(d=>{if(!d.ok){pmsg(d.error||"الرقم السري غير صحيح.",1);try{sessionStorage.removeItem("pin")}catch(e){};return}
  PIN=pin;try{sessionStorage.setItem("pin",pin)}catch(e){}setPD(d);renderPanel();
  if(!window.__rf)window.__rf=setInterval(()=>{if(PD&&!$("#modal"))pfetch(PIN).then(d=>{if(d.ok){setPD(d);updatePanel();const c=$("#pc");if(c)c.textContent+=" • آخر تحديث "+new Date().toLocaleTimeString("ar-OM",{hour:"2-digit",minute:"2-digit"})}}).catch(()=>{})},60000)}).catch(()=>pmsg("تعذّر الاتصال بالجدول. تأكدي من رابط Apps Script ونشره.",1))}
function panelReload(){const c=$("#pc");if(c)c.textContent="جارٍ التحديث...";pfetch(PIN).then(d=>{if(d.ok){setPD(d);renderPanel()}else{PD=null;drawPanel()}}).catch(()=>{if(c)c.textContent="تعذّر التحديث."})}
function renderPanel(){app.className="wide";
 const opt=(a,all)=>`<option value="">${all}</option>`+a.map(x=>`<option>${esc(x)}</option>`).join("");
 app.innerHTML=`<div class="card"><div class="row top"><span class="pill">لوحة المعلمة المشرفة</span><button class="btn alt" onclick="panelReload()">⟳ تحديث</button></div><hr class="hr"><p class="note">${esc(SCHOOL)} • إشراف: ${esc(SPECIALIST)}</p><div id="pk" class="kp"></div>
 <div class="fl"><input id="fq" placeholder="🔍 بحث بالاسم" oninput="updatePanel()"><select id="fg" onchange="updatePanel()">${opt(Object.keys(GK),"كل الصفوف")}</select><select id="fs" onchange="updatePanel()">${opt(["ذكر","أنثى"],"الجنسان")}</select><select id="fv" onchange="updatePanel()">${opt(govs,"كل المحافظات")}</select><select id="ft" onchange="updatePanel()"><option value="">كل الحالات</option><option value="done">مكتمل</option><option value="prog">قيد الإجراء</option></select><select id="fe" onchange="updatePanel()"><option value="">كل البيئات الأولى</option>${T.map(t=>`<option value="${t.k}">${t.n}</option>`).join("")}</select></div>
 <div class="row"><button class="btn" onclick="dlCsv()">⬇ تنزيل النتائج (Excel / CSV)</button><button class="btn alt" onclick="print()">🖨 طباعة</button><span class="note" id="pc" style="align-self:center"></span></div></div><div id="pb"></div>`;
 updatePanel()}
function bars(title,en,fmt){const mx=Math.max(1,...en.map(e=>e[1]));return `<div class="card"><h3>${title}</h3>${en.length?en.map(([l,v,w])=>`<div class="br"><span>${esc(l)}</span><div class="bt"><i style="width:${(w!=null?w:v/mx)*100}%"></i></div><b>${fmt?fmt(v):v}</b></div>`).join(""):'<p class="note">لا توجد بيانات.</p>'}</div>`}
function updatePanel(){const f={q:$("#fq").value.trim(),gr:$("#fg").value,sx:$("#fs").value,gv:$("#fv").value,st:$("#ft").value,en:$("#fe").value};
 const L=PL=PD.filter(x=>(!f.q||String(x.name).includes(f.q))&&(!f.gr||x.grade===f.gr)&&(!f.sx||x.sex===f.sx)&&(!f.gv||x.gov===f.gv)&&(!f.st||(f.st==="done"?!!x.code:!x.code))&&(!f.en||(x.code||"")[0]===f.en));
 const D=L.filter(x=>x.code),today=new Date().toLocaleDateString("sv-SE");
 $("#pk").innerHTML=[["إجمالي الطالبات",L.length],["أكملن المقياس",D.length],["قيد الإجراء",L.length-D.length],["نسبة الإكمال",L.length?Math.round(D.length/L.length*100)+"%":"0%"],["دخلن اليوم",L.filter(x=>String(x.start).startsWith(today)).length]].map(([a,b])=>`<div><b>${b}</b>${a}</div>`).join("");
 $("#pc").textContent=`المعروض ${L.length} من ${PD.length}`;
 const cnt=(arr,key)=>{const m={};arr.forEach(x=>{const k=key(x);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const first=T.map(t=>[t.n,D.filter(x=>x.code[0]===t.k).length]);
 const avg=T.map((t,j)=>[t.n,D.length?D.reduce((s,x)=>s+(+x.raw[j]||0),0)/D.length:0]).map(([n,v])=>[n,v,v/9]);
 const rows=L.map(x=>{const ok=!!x.code;return `<tr class="rw" onclick="showStudent(${x._i})"><td style="text-align:right">${esc(x.name)}</td><td>${esc(x.grade)}</td><td>${esc(x.sex)}</td><td>${esc(x.gov)}</td><td><b>${cAr(x.code)}</b></td><td><span class="tg ${ok?"ok":"pr"}">${ok?"مكتمل":"قيد الإجراء"}</span></td>${T.map((t,j)=>ok?`<td style="background:rgba(139,18,38,${(+x.raw[j]||0)/9*.3})">${+x.raw[j]||0}</td>`:"<td>—</td>").join("")}<td>${esc(x.start)}</td></tr>`}).join("");
 const ago=x=>{const d=new Date(String(x.done||x.start).replace(" ","T")+":00+04:00"),m=Math.max(0,Math.round((Date.now()-d)/60000));return isNaN(m)?"":m<1?"الآن":m<60?`قبل ${m} دقيقة`:m<1440?`قبل ${Math.round(m/60)} ساعة`:`قبل ${Math.round(m/1440)} يوم`};
 const recent=`<div class="card"><h3>🕘 آخر من دخلن للمقياس (اضغطي على اسم لعرض أدائها)</h3>${L.slice(0,8).map(x=>`<div class="jb" style="cursor:pointer" onclick="showStudent(${x._i})"><span>${esc(x.name)}</span><small class="note">${esc(x.grade)} • ${esc(x.gov)}</small><em>${x.code?"أكملت • "+cAr(x.code):"قيد الإجراء"}</em><small class="note">${ago(x)}</small></div>`).join("")||'<p class="note">لا توجد بيانات بعد.</p>'}</div>`;
 $("#pb").innerHTML=`${recent}<div class="pg">${bars("البيئة المهنية الأولى (للمكتملات)",first)}${bars("متوسط الدرجة الخام لكل بيئة (من 9)",avg,v=>v.toFixed(1))}${bars("حسب الصف",cnt(L,x=>x.grade))}${bars("حسب المحافظة",cnt(L,x=>x.gov))}</div>
 <div class="card"><h3>الطالبات (اضغطي على اسم للتفاصيل)</h3><div class="pt"><table><tr><th>الاسم</th><th>الصف</th><th>النوع</th><th>المحافظة</th><th>الرمز</th><th>الحالة</th>${T.map(t=>`<th>${t.n}</th>`).join("")}<th>وقت البدء</th></tr>${rows||'<tr><td colspan="13">لا توجد نتائج مطابقة.</td></tr>'}</table></div></div>`}
function dlCsv(){const H=["الاسم","المدرسة","المحافظة","الصف","النوع","الحالة","الرمز المهني",...T.map(t=>t.n),"وقت البدء","وقت الإكمال"];
 const q=v=>{v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const rows=PL.map(x=>[x.name,x.school,x.gov,x.grade,x.sex,x.code?"مكتمل":"قيد الإجراء",x.code?cAr(x.code):"",...T.map((t,j)=>x.code?(+x.raw[j]||0):""),x.start,x.done]);
 const csv="\ufeff"+[H,...rows].map(r=>r.map(q).join(",")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="career-scale-results.csv";document.body.appendChild(a);a.click();a.remove()}
function showStudent(i){const x=PD[i],nm=NORMS[(GK[x.grade]||9)+(x.sex==="أنثى"?"F":"M")]||{};closeModal();
 let b=`<h2 style="margin:0">${esc(x.name)}</h2><p class="note">${esc(x.school)} • ${esc(x.gov)} • الصف ${esc(x.grade)} • ${esc(x.sex)}<br>بدأت: ${esc(x.start)}${x.done?" • أكملت: "+esc(x.done):""}</p>`;
 if(!x.code)b+=`<div class="warn">لم تكمل المقياس بعد.</div>`;
 else{const rs=T.map((t,j)=>({...t,raw:+x.raw[j]||0,pr:(nm[t.k]||[])[+x.raw[j]||0]}));
  b+=`<h3>الرمز المهني</h3><div class="big">${cAr(x.code)}</div><div class="scroll"><table><tr><th>البيئة</th><th>الرمز</th><th>الدرجة (من 9)</th><th>الرتبة المئينية</th></tr>${rs.map(r=>`<tr><td>${r.n}</td><td>${r.k}</td><td>${r.raw}</td><td>${r.pr==null?"—":r.pr}</td></tr>`).join("")}</table></div>${jobsHTML(x.code)}`}
 b+=`<div class="row noprint"><button class="btn" onclick="print()">🖨 طباعة / PDF</button><button class="btn alt" onclick="closeModal()">إغلاق</button></div><p class="note">${esc(SCHOOL)} • إشراف: ${esc(SPECIALIST)}</p>`;
 const m=document.createElement("div");m.id="modal";m.onclick=e=>{if(e.target===m)closeModal()};m.innerHTML=`<div class="mc">${b}</div>`;document.body.appendChild(m);document.body.classList.add("pm")}
function closeModal(){const m=$("#modal");if(m)m.remove();document.body.classList.remove("pm")}

drawPanel();
</script>
</body>
</html>
