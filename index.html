function drawStats(){app.innerHTML=`<div class="card"><div class="row top"><button class="btn alt" onclick="go(0)">→ العودة للرئيسية</button><span class="pill">لوحة الإحصائيات التراكمية</span></div><hr class="hr"><h2>لوحة أخصائية التوجيه المهني</h2><p class="note">${SPECIALIST} | ${SCHOOL}</p><div class="priv"><b>خصوصية وسرية تامة:</b> لا تُعرض أسماء الطلبة أو رموزهم الفردية، وتقتصر الإحصائيات على توزيع المحافظات وإجمالي المستفيدين.</div><div id="st">جارٍ التحميل...</div></div>`;
 if(!SHEET_URL){$("#st").textContent="لم يُربط جدول البيانات بعد.";return}
 fetch(SHEET_URL+"?action=stats").then(r=>r.json()).then(d=>{const t=d.total||0;$("#st").innerHTML=`<div class="stat"><div><b>${t}</b>إجمالي الطلبة</div><div><b>${d.completed||0}</b>أكملوا المقياس</div><div><b>${Object.values(d.byGov||{}).filter(x=>x>0).length}</b>محافظات مشاركة</div><div><b>${d.days||0}</b>أيام النشاط</div></div><h3>توزيع المستخدمين حسب المحافظات</h3><div class="scroll"><table><tr><th>المحافظة</th><th>العدد</th><th>النسبة</th></tr>${govs.map(g=>{const n=(d.byGov||{})[g]||0;return`<tr><td>${g}</td><td>${n}</td><td>${t?Math.round(n/t*100):0}%</td></tr>`}).join("")}</table></div>`}).catch(()=>{$("#st").textContent="تعذّر تحميل الإحصائيات."})}
if(SHEET_URL)fetch(SHEET_URL+"?action=stats").then(r=>r.json()).then(d=>{$("#uc").textContent=d.total||0}).catch(()=>{});
render();
</script>
</body>
</html>
